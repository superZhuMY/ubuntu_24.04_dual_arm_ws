/**:
  ros__parameters:
    # Geometric simplification. Safety checks may retain more points.
    max_prismatic_step: 0.01
    max_revolute_step: 0.05
    prismatic_chord_error: 0.002
    revolute_chord_error: 0.02
    direction_change_degrees: 15.0

    # Advance only after real feedback remains inside tolerance.
    prismatic_tolerance: 0.002
    revolute_tolerance: 0.02
    stable_samples: 3
    waypoint_timeout: 15.0
    state_stale_timeout: 1.0
    feedback_period: 0.05

    # Validate every proposed shortcut through MoveIt's current planning scene.
    collision_check: true
    require_collision_service: true
    collision_service: /check_state_validity
    collision_service_timeout: 5.0
    collision_prismatic_resolution: 0.005
    collision_revolute_resolution: 0.025

    # Calibration mode: never execute both arms concurrently.
    allow_simultaneous_arms: false
