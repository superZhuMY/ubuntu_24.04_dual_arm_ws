# Manual harvest targets for send_manual_harvest_goal.py.
#
# These coordinates are the forward kinematics of an interior, non-singular
# joint configuration of each arm (verified 30/30 on /compute_ik with random
# seeds during harvest H2 bring-up). The HOME pose itself is a poor pose-goal
# target on this robot: its Y-Z-Y wrist sits on the theta5=0 singularity and
# J3 rests 0.01 above its lower limit, so IK goal sampling fails.
#
# They are NOT calibrated harvest points and must never be sent to real
# hardware as-is. Replace both arms with measured, safe targets before any
# STM32 run.
