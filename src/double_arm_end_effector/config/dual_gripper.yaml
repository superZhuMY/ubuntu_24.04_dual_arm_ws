dual_gripper_controller:
  ros__parameters:
    # Fixed USB socket 1-2.2.3 is the gripper adapter. by-path survives replug;
    # the other CH340 socket 1-2.2.2 is the STM32 controller.
    device: /dev/serial/by-path/pci-0000:06:00.3-usb-0:2.2.3:1.0-port0
    baud_rate: 9600
    parity: "N"
    data_bits: 8
    stop_bits: 1
    response_timeout_ms: 1000

    # Current controller: slave 3, channels 1 and 3 (read back before writing).
    slave_id: 3
    left_register: 1
    right_register: 3

    # Values used by the old RS485 driver. The normalized Action input maps
    # 0.0 to open and 1.0 to closed independently for each gripper.
    left_open_value: 60
    left_closed_value: 40
    right_open_value: 25
    right_closed_value: 40

    # Preserve the old driver's repeated-write behavior.
    write_repeats: 2
    write_delay_ms: 500

    # Real motion stays locked until explicitly enabled.
    allow_motion: false
    mock_hardware: false
